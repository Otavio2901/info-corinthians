<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css\login.css">
</head>

<body>
    <div class="main-content">
        <div class="header">
            <h1>Info-Timão</h1>
            <div class="botaoPreto">
                <a href="index.html"><button>Inicio</button></a>
            </div>
            <a href="login.html"><button>Login</button></a>
            <div class="botaoVermelho">
                <a href="cadastro.html"><button>Cadastrar</button></a>
            </div>
            <div class="logoCorinthians">
                <img src="img/Corinthians_simbolo.png" alt="logo">
            </div>
        </div>
        <div class="main">
            <div class="mainha">
                <h1>Login</h1>
                <br><br>
                <input type="text" placeholder="email" id="ipt_email">
                <br><br>
                <input type="password" placeholder="senha" id="ipt_senha">
                <br><br>
                <button onclick="login()">Login</button>
                <div id="div_mensagem"></div>
            </div>
        </div>
</body>

</html>
<script>

    function login() {

        let emailVar = ipt_email.value;
        let senhaVar = ipt_senha.value;

        div_mensagem.innerHTML = "";

        if (emailVar == "" || senhaVar == "") {

            div_mensagem.style.color = "red";
            div_mensagem.innerHTML =
                "⚠️ Preencha todos os campos!";

            return false;
        }

        if (emailVar.indexOf("@") == -1 || emailVar.indexOf(".") == -1) {

            div_mensagem.style.color = "red";
            div_mensagem.innerHTML =
                "⚠️ Email inválido!";

            return false;
        }

        fetch("/usuarios/autenticar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })

        })

            .then(function (resposta) {

                console.log(resposta);

                if (resposta.ok) {

                    resposta.json().then(function (json) {

                        console.log(json);

                        sessionStorage.setItem("EMAIL_USUARIO", json[0].email);
                        sessionStorage.setItem("NOME_USUARIO", json[0].nome);
                        sessionStorage.setItem("ID_USUARIO", json[0].idUsuario);

                        console.log(sessionStorage);

                        div_mensagem.style.color = "green";

                        div_mensagem.innerHTML =
                            "✅ Login realizado com sucesso!";

                        setTimeout(function () {

                          window.location = "avaliacao.html";

                        }, 1000);

                    });

                } else {

                    div_mensagem.style.color = "red";

                    div_mensagem.innerHTML =
                        "❌ Email ou senha inválidos!";
                }

            })

            .catch(function (erro) {

                console.log(erro);

            });

        return false;
    }

</script>
