<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

<body>

    <div class="main-content">

        <div class="header">

            <div class="botaoPreto">
                <a href="index.html">

            <a href="login.html">
                <button>Login</button>
            </a>

            <div class="botaoVermelho">

            </div>

            <div class="logoCorinthians">
                <img src="img/Corinthians_simbolo.png" alt="logo">
            </div>
        </div>

        <div class="main">

            <h1>Avaliação Copa do Brasil</h1>

            <div class="avd_copaBrasil">
                <p>Copa do Brasil:</p>

                <select id="select_partida2">

                    <option value="">Selecione</option>

                    <option value="1">
                        30/04/2025 - Grêmio Novo Horizontino - Jogo Ida
                    </option>

                    <option value="2">
                        21/05/2025 - Grêmio Novo Horizontino - Jogo Volta
                    </option>

                    <option value="3">
                        30/07/2025 - Palmeiras - Jogo Ida
                    </option>

                    <option value="4">
                        06/08/2025 - Palmeiras - Jogo Volta
                    </option>

                    <option value="5">
                        27/08/2025 - Athletico Paranaense - Jogo Ida
                    </option>

                    <option value="6">
                        10/09/2025 - Athletico Paranaense - Jogo Volta
                    </option>

                    <option value="7">
                        10/12/2025 - Cruzeiro - Jogo Ida
                    </option>

                    <option value="8">

                    </option>

                    <option value="9">

                    </option>

                    <option value="10">

                    </option>

            </div>

            <div class="comentario">
                <p>Deixe seu comentário sobre o que achou desta partida:</p>

                <textarea id="txt_comentario" placeholder="Digite seu comentário aqui"></textarea>
            </div>

            <div class="container-botoes-copaDoBrasil">

                <p>Avaliação Partida Copa do Brasil:</p>

                <select id="select_avaliacao_copaBrasil" class="select-avaliacao">

                    <option value="">Selecione sua avaliação</option>

                    <option value="Muito Bom">🟢 Ótimo</option>

                    <option value="Bom">🟩 Bom</option>

                    <option value="Mediana">🟨 Regular</option>

                    <option value="Ruim">🟥 Ruim</option>

                    <option value="Muito Ruim">⬛ Horrível</option>

                </select>
            </div>
            <br><br>
            <div class="botao_cadastrar">
                <button onclick="cadastrar()">Cadastrar Avaliação</button>
            </div>
        </div>
    </div>

</body>

</html>
<script>
    
function cadastrar() {

        let partida2 = select_partida2.value

        let comentario2 = txt_comentario.value

        let avaliacao_copaDoBrasil = select_avaliacao_copaBrasil.value

        if (partida2 == "") {
            alert("Selecione uma Partida da Copa do Brasil")
            return
        }
        if (comentario2.trim() == "") {
            alert("Digite um comentário da partida da Copa do Brasil Selecionada ")
            return
        }
        if (avaliacao_copaDoBrasil == "") {
            alert("Selecione uma avaliação sobre a partida da Copa do Brasil")
            return
        }
        else {
            alert("Avaliação enviada com sucesso!")
              setTimeout(() => {
            window.location.href = "dashboard.html";
          }, "1000");
            console.log(`
        Partida: ${partida2}
        Comentário: ${comentario2}
        Nota: ${avaliacao_copaDoBrasil}
    `)
    cadastrarAvaliacaoCdb();
        }
    }
    function cadastrarAvaliacaoCdb() {

    // var dataAvaliacao = input_dataPartida.value;
    // var adversario = input_adversario.value;
    let comentario = txt_comentario.value
    var fkUsuario = sessionStorage.getItem("ID_USUARIO")   
    var notaPartida = select_avaliacao_copaBrasil.value;
    var fkCopaDoBrasil = select_partida2.value;
    console.log(fkCopaDoBrasil)

    fetch("/avaliacao/cadastrarAvaliacaoCdb", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({

            // dataAvaliacaoServer: dataAvaliacao,
            // adversarioServer: adversario,
            fkCopaDoBrasilServer: fkCopaDoBrasil,
            notaPartidaServer: notaPartida,
            comentarioServer: comentario,
            fkUsuarioServer: fkUsuario,
        }),
    })

    .then(function (resposta) {

        console.log("resposta: ", resposta);

        if (resposta.ok) {

            div_mensagem.innerHTML =
                "Avaliação cadastrada com sucesso!";

            limparFormulario();

        } else {

            throw "Houve um erro ao tentar realizar a avaliação!";

        }
    })

    .catch(function (resposta) {

        console.log(`#ERRO: ${resposta}`);

    });

    return false;
}
</script>
