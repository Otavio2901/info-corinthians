<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Corinthians</title>

    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <div class="main-content">

        <div class="sidebar">

            <div class="logo">

                <img src="img/Corinthians_simbolo.png">

            </div>

            <div class="menu_botao">
                
                <a href="dashboard.html">
                    <button onclick="inicio()">Dashboard</button>
                </a>

                <a href="avaliacao.html">
                    <button onclick="avaliacao()">Avaliação</button>
                </a>

                <a href="index.html">
                    <button onclick="inicio()">Início</button>
                </a>

            </div>
        </div>

    
    <div class="conteudo">

        <h1>Dashboard</h1>

        <p>
            Visão geral das avaliações da Fiel Torcida
        </p>
        <div class="kpis">

            <div class="card">

                <h2>Total de Avaliações:</h2>
                <p id="msg_total_avaliacoes">Teste</p>
            </div>

            <div class="card">

                <h2>Nota que mais apareceu:</h2>
                <p id="msg_media_notas">Teste</p>
            </div>

            <div class="card">

                <h2>Jogador Favorito:</h2>
                <p id="msg_jogador_favorito">Teste</p>
            </div>

        </div>
        <div class="grafico">
            <canvas id="grafico"></canvas>
        </div>
    </div></div>
    </div>

</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    fetch("/dashboard/kpis/avaliacoes")
    .then((resposta) => resposta.json())
    .then((resposta) => {
        msg_total_avaliacoes.innerHTML = ` ${resposta[0].total}`
    });

fetch("/dashboard/kpis/mediaNota")
    .then((resposta) => resposta.json())
    .then((resposta) => {
        msg_media_notas.innerHTML = resposta[0].notaPartida;
    });


var idUsuario = sessionStorage.getItem("ID_USUARIO");

fetch(`/dashboard/kpis/jogadorFavoritoUsuario/${idUsuario}`)
    .then((resposta) => resposta.json())
    .then((resposta) => {
        msg_jogador_favorito.innerHTML = resposta[0].jogador;
    });

fetch("/dashboard/grafico/DadosDashboard")
    .then((resposta) => resposta.json())
    .then((resposta) => {
        const traducao = {
            "Ótimo":  { label: "Muito Bom", cor: "#00C853" },
            "Bom":        { label: "Bom",        cor: "#64DD17" },
            "Regular":    { label: "Regular",    cor: "#FFD600" },
            "Ruim":       { label: "Ruim",       cor: "#FF6D00" },
            "Horrível": { label: "Horrível",   cor: "#D50000" },
        };

        let labels = [], quantidade = [], cores = [];

        for (let i = 0; i < resposta.length; i++) {
            let nota = resposta[i].notaPartida;
            let info = traducao[nota];
            labels.push(info ? info.label : nota);
            cores.push(info ? info.cor : "#999999");
            quantidade.push(resposta[i].quantidade);
        }

        new Chart(document.getElementById('grafico'), {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Resultados',
                    data: quantidade,
                    backgroundColor: cores,
                    borderWidth: 1
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    });
</script>
