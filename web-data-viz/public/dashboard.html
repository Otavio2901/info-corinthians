<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Corinthians</title>

    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

    <div class="main-content">

        <div class="sidebar">

            <div class="logo">

                <img src="img/Corinthians_simbolo.png">

            </div>

            <div class="menu_botao">

                <a href="avaliacao.html">
                    <button onclick="avaliacao()">Avaliação</button>
                </a>

                <a href="index.html">
                    <button onclick="inicio()">Início</button>
                </a>

            </div>
        </div>

    
    <div class="conteudo">

        <h1>Dashboard</h1>

        <p>
            Visão geral das avaliações da Fiel Torcida
        </p>
        <div class="kpis">

            <div class="card">

                <h2>Total de Avaliações</h2>
                <p id="msg_total_avaliacoes">Teste</p>
            </div>

            <div class="card">

                <h2>Nota que mais apareceu</h2>
                <p id="msg_media_notas">Teste</p>
            </div>

            <div class="card">

                <h2>Jogador Favorito</h2>
                <p id="msg_jogador_favorito">Teste</p>
            </div>

        </div>
        <div class="grafico">
            <canvas id="grafico"></canvas>
        </div>
    </div></div>
    </div>

</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

    fetch("/dashboard/kpis/avaliacoes")
    .then((resposta) => resposta.json())
    .then((resposta) => {
        msg_total_avaliacoes.innerHTML = resposta[0].total;
    });

      fetch("/dashboard/kpis/mediaNota")
    .then((resposta) => resposta.json())
    .then((resposta) => {
        msg_media_notas.innerHTML = resposta[0].notaPartida;
        console.log(resposta);
    });

      fetch("/dashboard/kpis/jogadorFavorito")
    .then((resposta) => resposta.json())
    .then((resposta) => {
        msg_jogador_favorito.innerHTML = resposta[0].jogador;
    });
          fetch("/dashboard/grafico/DadosDashboard")
    .then((resposta) => resposta.json())
    .then((resposta) => { 
        console.log(resposta);

        // const total =   

        const ctx = document.getElementById('grafico');

        let nota_partida = []
        let quantidade = []

            for(let i = 0; i < resposta.length; i++){
                nota_partida[i] = resposta[i].notaPartida
                quantidade[i] = resposta[i].quantidade
            }

            console.log(quantidade)
            console.log(nota_partida)
            
        new Chart(ctx, {
            type: 'pie',

            data: {
                labels: [
                    'Muito Bom',
                    'Bom',
                    'Mediana',
                    'Ruim',
                    'Muito Ruim'
                ],

                datasets: [{
                    label: 'Resultados',

                    data: quantidade,   
                
                
                backgroundColor: [
                '#00C853', // Muito Bom
                '#64DD17', // Bom
                '#FFD600', // Mediana
                '#FF6D00', // Ruim
                '#D50000'  // Muito Ruim
                ],

                    borderWidth: 1
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    });

   

</script>
