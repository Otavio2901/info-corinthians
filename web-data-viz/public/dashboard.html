<canvas id="grafico"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

    const ctx = document.getElementById('grafico');

    new Chart(ctx, {
        type: 'pie',

        data: {
            labels: [
                'Muito Bom',
                'Bom',
                'Mediana',
                'Ruim',
                'Muito Ruim'
            ],

            datasets: [{
                label: 'Resultados',

                data: [30, 25, 20, 15, 10],   
            
            
            backgroundColor: [
            '#00C853', // Muito Bom
            '#64DD17', // Bom
            '#FFD600', // Mediana
            '#FF6D00', // Ruim
            '#D50000'  // Muito Ruim
            ],

                borderWidth: 1
            }]
        },

        options: {
            responsive: true
        }
    });

</script>
